<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2>Cadastro de Candidato</h2>

  <form [formGroup]="formCandidato" (ngSubmit)="salvar()">
    
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <label>Nome:</label>
      <input type="text" formControlName="nome" placeholder="Digite seu nome">

      <label>Sobrenome:</label>
      <input type="text" formControlName="sobrenome" placeholder="Digite seu sobrenome">

      <label>E-mail:</label>
      <input type="email" formControlName="email" placeholder="exemplo@email.com">

      <label>CPF:</label>
      <input type="text" formControlName="cpf" placeholder="Apenas números">

      <label>Data de Nascimento:</label>
      <input type="date" formControlName="dataNascimento">

      <label>País:</label>
      <input type="text" formControlName="pais">

      <label>CEP:</label>
      <input type="text" formControlName="cep">

      <label>Senha:</label>
      <input type="password" formControlName="senha">

      <button type="submit" [disabled]="formCandidato.invalid" style="padding: 10px; margin-top: 15px;">
        Cadastrar
      </button>
    </div>

  </form>
</div>
